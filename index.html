<html lang="en">

<style>
  :root{
    --ink:#12100E; --surface:#1A1714; --raise:#221E1A;
    --rule:#332D26; --ruleSoft:#241F1A;
    --bone:#E9E3D7; --graphite:#8C8378; --dim:#5A534A; --stamp:#B4304A;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  html{color-scheme:dark;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0 !important; padding:0; background:#12100E !important;
    color:#E9E3D7 !important;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
  /* backdrop layer: survives any host stylesheet that repaints body */
  body::before{content:""; position:fixed; inset:0; background:#12100E; z-index:-1;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  #app{min-height:100vh; background:#12100E; color:#E9E3D7;
    padding-top:env(safe-area-inset-top);}
  button{font:inherit; cursor:pointer;}
  button:active{filter:brightness(1.35);}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--graphite);}
  .bar{display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--rule);
    position:sticky; top:0; background:var(--ink); z-index:20;}
  .back{display:flex; align-items:center; gap:10px; background:none; border:none;
    padding:6px 4px; margin:-6px -4px; color:var(--bone); font-family:var(--mono);
    font-size:13px; letter-spacing:.1em; text-transform:uppercase; max-width:72vw;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .back i{color:var(--graphite); font-style:normal; font-size:16px;}

  .slab{display:block; width:100%; text-align:left; background:var(--surface);
    border:1px solid var(--rule); border-radius:3px; color:var(--bone);
    padding:26px 20px; margin-bottom:10px; font-family:var(--mono);
    font-size:25px; letter-spacing:.03em;}
  .slab span{float:right; font-size:11px; color:var(--dim);
    letter-spacing:.16em; line-height:30px;}

  .movement{display:flex; width:100%; align-items:center; justify-content:space-between;
    gap:12px; background:none; border:none; border-top:1px solid var(--ruleSoft);
    color:var(--bone); padding:17px 18px; text-align:left; font-size:16px;}
  .movement em{font-family:var(--mono); font-size:12px; font-style:normal;
    letter-spacing:.1em; color:var(--dim);}
  .movement em.has{color:var(--bone);}

  /* summary card */
  .card{margin:18px; border:1px solid var(--rule); border-radius:3px;
    background:var(--surface); display:flex;}
  .card div{flex:1; padding:16px 6px; text-align:center; border-left:1px solid var(--ruleSoft);}
  .card div:first-child{border-left:none;}
  .card b{display:block; font-family:var(--mono); font-size:19px; font-weight:500;
    color:var(--bone); letter-spacing:-.01em;}
  .card u{display:block; text-decoration:none; font-family:var(--mono); font-size:9px;
    letter-spacing:.16em; color:var(--dim); text-transform:uppercase; margin-top:6px;}

  /* grouped history block */
  .blk{display:flex; width:100%; gap:12px; align-items:flex-start; text-align:left;
    background:none; border:none; border-top:1px solid var(--ruleSoft);
    color:var(--bone); padding:16px 14px 16px 18px;}
  .blk .name{flex:1; min-width:0;}
  .blk .name h4{margin:0; font-size:15.5px; font-weight:500; letter-spacing:-.01em;}
  .blk .name p{margin:5px 0 0; font-family:var(--mono); font-size:11px;
    letter-spacing:.06em; color:var(--graphite);}
  .blk .name p.ramp{color:var(--dim);}
  .blk .sets{font-family:var(--mono); font-size:14px; text-align:right;
    line-height:1.55; white-space:nowrap; color:var(--bone);}
  .blk .sets b{color:var(--dim); font-weight:400; margin:0 5px;}
  .blk .chev{color:var(--dim); font-size:15px; align-self:center; padding-left:2px;}

  .row{display:flex; align-items:baseline; gap:12px; padding:13px 18px;
    border-bottom:1px solid var(--ruleSoft); font-family:var(--mono);}
  .row.rampset{opacity:.55;}
  .row .t{font-size:12px; color:var(--dim); min-width:62px;}
  .row .t.fresh{color:var(--stamp);}
  .row .m{flex:1; min-width:0;}
  .row .sub{display:block; font-size:11px; color:var(--graphite);
    letter-spacing:.06em; margin-bottom:3px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;}
  .row .fig{font-size:17px; color:var(--bone);}
  .row .fig b{color:var(--dim); font-weight:400; margin:0 7px;}
  .row .g{font-size:12px; color:var(--dim); min-width:54px; text-align:right;}
  .row .void{background:none; border:1px solid var(--rule); border-radius:2px;
    color:var(--graphite); font-family:var(--mono); font-size:10px;
    letter-spacing:.16em; padding:5px 9px;}

  .field{flex:1; min-width:0;}
  .box{background:var(--surface); border:1px solid var(--rule);
    border-radius:3px; padding:10px 6px 6px;}
  .box input{width:100%; background:none; border:none; outline:none;
    text-align:center; font-family:var(--mono); font-size:40px; font-weight:500;
    color:var(--bone); letter-spacing:-.02em; padding:0; -moz-appearance:textfield;}
  .box input.bw{color:var(--graphite);}
  .unit{text-align:center; font-family:var(--mono); font-size:10px;
    letter-spacing:.18em; color:var(--dim); height:13px; margin-top:-2px;}
  .steps{display:flex; gap:5px; margin-top:10px;}
  .steps button{flex:1; background:var(--raise); border:1px solid var(--rule);
    border-radius:2px; color:var(--bone); font-family:var(--mono);
    font-size:13px; padding:12px 0;}

  .kind{display:flex; gap:6px; margin-top:16px;}
  .kind button{flex:1; background:var(--surface); border:1px solid var(--rule);
    border-radius:2px; color:var(--dim); font-family:var(--mono); font-size:12px;
    letter-spacing:.2em; padding:14px 0;}
  .kind button.on{background:var(--raise); border-color:var(--bone); color:var(--bone);}

  .perform{width:100%; margin-top:10px; background:var(--stamp); border:none;
    border-radius:3px; color:#fff; font-family:var(--mono); font-size:17px;
    font-weight:600; letter-spacing:.3em; padding:26px 0;}
  .perform.ramp{background:var(--raise); color:var(--bone);
    border:1px solid var(--rule);}
  .note{font-family:var(--mono); font-size:10px; color:var(--dim);
    letter-spacing:.13em; text-align:center; padding:12px 0 4px;}

  .chip{background:var(--surface); border:1px solid var(--rule); border-radius:2px;
    color:var(--graphite); font-family:var(--mono); font-size:12px;
    letter-spacing:.06em; padding:11px 13px;}
  .chip.on{background:var(--bone); border-color:var(--bone); color:var(--ink);}

  .ghost{background:none; border:1px solid var(--rule); border-radius:2px;
    color:var(--bone); font-family:var(--mono); font-size:12px;
    letter-spacing:.14em; padding:14px 16px; width:100%; text-transform:uppercase;}
  .empty{padding:20px 18px 40px; color:var(--dim); font-family:var(--mono); font-size:13px;}
  .head{padding:22px 18px 9px;}
  textarea{width:100%; height:130px; background:var(--surface); color:var(--bone);
    border:1px solid var(--rule); border-radius:3px; font-family:var(--mono);
    font-size:11px; padding:10px;}
  .fresh-in{animation:si 260ms cubic-bezier(.2,.7,.3,1);}
  @keyframes si{from{opacity:0;transform:translateY(-7px)} to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.fresh-in{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ══ movements ═══════════════════════════════════════════ */
const EX = {
  pc:{n:"Power clean",s:"lower",g:"Power"},
  sld:{n:"Straight-leg deadlift",s:"lower",g:"Hinge"},
  tsl:{n:"Trap bar single-leg DL",s:"lower",g:"Hinge"},
  gbm:{n:"Glute bridge machine",s:"lower",g:"Hip"},
  ghr:{n:"Glute-ham raise",s:"lower",g:"Hip",bw:1},
  lex:{n:"Leg extension",s:"lower",g:"Knee"},
  lcu:{n:"Leg curl",s:"lower",g:"Knee"},
  cra:{n:"Standing calf raise",s:"lower",g:"Lower leg"},
  tib:{n:"Tibialis raise",s:"lower",g:"Lower leg"},
  pla:{n:"Planche progression",s:"upper",g:"Skill strength",iso:1,bw:1,
       vars:["Tuck","Adv. tuck","Straddle","Half lay","Full"]},
  fle:{n:"Ring front lever",s:"upper",g:"Skill strength",iso:1,bw:1,
       vars:["Tuck","Adv. tuck","One-leg","Straddle","Full"]},
  bp:{n:"Bench press",s:"upper",g:"Press"},
  pu:{n:"Push-ups",s:"upper",g:"Press",bw:1},
  sap:{n:"Standing single-arm press",s:"upper",g:"Press"},
  wpu:{n:"Weighted neutral pull-up",s:"upper",g:"Pull",bw:1},
  rap:{n:"Ring archer pull-up",s:"upper",g:"Pull",bw:1},
  hcr:{n:"Standing high cable row",s:"upper",g:"Pull"},
  blr:{n:"Banded lateral raise",s:"upper",g:"Shoulders",bw:1},
  wlr:{n:"Weighted lateral raise",s:"upper",g:"Shoulders"},
  idc:{n:"Incline dumbbell curl",s:"upper",g:"Arms"},
  ctp:{n:"Cable triceps pushdown",s:"upper",g:"Arms"},
  fw:{n:"Forearm work",s:"upper",g:"Forearms"}
};
const IDS = Object.keys(EX);

/* ══ store ═══════════════════════════════════════════════ */
const KEY = "ledger.v1";
let DB = {v:1, entries:[], prefs:{}};
let saveErr = null;
function load(){
  try{ const raw = localStorage.getItem(KEY);
    if(raw) DB = Object.assign({v:1,entries:[],prefs:{}}, JSON.parse(raw));
  }catch(e){ saveErr = "Could not read stored ledger."; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); saveErr = null; }
  catch(e){ saveErr = "Storage full or blocked. Export a backup."; }
}

/* ══ time ════════════════════════════════════════════════ */
const pad = n => String(n).padStart(2,"0");
function dayKey(ts){ const d = new Date(ts);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function clock(ts){ const d = new Date(ts);
  return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); }
function gap(ms){
  if(ms==null) return "";
  const s = Math.round(ms/1000);
  if(s<60) return "+"+s+"s";
  const m = Math.floor(s/60);
  if(m<60) return "+"+m+":"+pad(s%60);
  return "+"+Math.floor(m/60)+"h"+pad(m%60);
}
function span(ms){
  const m = Math.round(ms/60000);
  if(m<60) return m+"m";
  return Math.floor(m/60)+"h "+pad(m%60)+"m";
}
function dayLabel(key){
  const p = key.split("-").map(Number);
  return new Date(p[0],p[1]-1,p[2])
    .toLocaleDateString(undefined,{weekday:"short",day:"2-digit",month:"short"}).toUpperCase();
}
const comma = n => n.toLocaleString("en-US");

/* ══ derive ══════════════════════════════════════════════ */
const byTime = (a,b) => b.ts - a.ts;
const kindOf = e => e.kind === "ramp" ? "ramp" : "work";
const dayOf = k => DB.entries.filter(e => dayKey(e.ts)===k).sort(byTime);
const exOf = (id,k) => DB.entries.filter(e => e.ex===id && (!k || dayKey(e.ts)===k)).sort(byTime);
function allDays(){
  return [...new Set(DB.entries.map(e => dayKey(e.ts)))].sort().reverse();
}
function figure(e){
  const m = EX[e.ex];
  const load = (e.w===0 && m.bw) ? "BW" : String(e.w);
  return load+'<b>×</b>'+(m.iso ? e.hold+"s" : String(e.reps));
}
function compact(e){
  const m = EX[e.ex];
  const load = (e.w===0 && m.bw) ? "BW" : String(e.w);
  return load+"×"+(m.iso ? e.hold+"s" : String(e.reps));
}
function volumeOf(list){
  return list.reduce((t,e) =>
    (!EX[e.ex].iso && kindOf(e)==="work") ? t + (e.w||0)*(e.reps||0) : t, 0);
}
/* group a day's entries by movement, in the order they first occurred */
function groupDay(k){
  const es = dayOf(k).slice().sort((a,b) => a.ts - b.ts);
  const out = [], idx = {};
  es.forEach(e => {
    if(idx[e.ex] == null){ idx[e.ex] = out.length; out.push({ex:e.ex, work:[], ramp:[], first:e.ts}); }
    out[idx[e.ex]][kindOf(e)].push(e);
  });
  return out;
}

/* ══ state ═══════════════════════════════════════════════ */
let S = {screen:"home", session:null, ex:null, day:null, fresh:null,
         w:0, reps:5, hold:10, variation:null, kind:"work"};
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ══ fragments ═══════════════════════════════════════════ */
function rowHTML(e, rest, opts){
  opts = opts || {};
  const m = EX[e.ex];
  const ramp = kindOf(e)==="ramp";
  const bits = [];
  if(opts.showEx) bits.push(m.n);
  if(e.variation) bits.push(e.variation);
  if(ramp) bits.push("ramp");
  return '<div class="row'+(opts.fresh?" fresh-in":"")+(ramp?" rampset":"")+'">'
    + '<span class="t'+(opts.fresh?" fresh":"")+'">'+clock(e.ts)+'</span>'
    + '<span class="m">'
      + (bits.length ? '<span class="sub">'+esc(bits.join(" · "))+'</span>' : '')
      + '<span class="fig">'+figure(e)+'</span></span>'
    + (opts.void ? '<button class="void" data-void="'+e.id+'">VOID</button>'
                 : '<span class="g">'+gap(rest)+'</span>')
    + '</div>';
}
function listHTML(entries, opts){
  return entries.map((e,i) =>
    rowHTML(e, entries[i+1] ? e.ts-entries[i+1].ts : null,
      Object.assign({}, opts, {fresh: S.fresh===e.id, void: opts.void && i===0}))).join("");
}

/* ══ screens ═════════════════════════════════════════════ */
function render(){
  if(S.screen==="entry"){ renderEntry(); return; }
  app.innerHTML = ({home:home, list:list, history:history,
                    day:dayView, mday:mdayView, data:dataView})[S.screen]();
  window.scrollTo(0,0);
}

function home(){
  const today = dayKey(Date.now());
  const es = dayOf(today);
  const c = s => IDS.filter(i => EX[i].s===s).length;
  return '<div class="bar">'
    + '<div><div class="eyebrow" style="color:var(--bone);font-size:12px">Ledger</div>'
    + '<div style="font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.16em;margin-top:4px">v0.2</div></div>'
    + '<div class="eyebrow">'+dayLabel(today)+'</div></div>'
    + '<div style="padding:26px 18px 10px">'
    + [["upper","Upper",c("upper")],["lower","Lower",c("lower")],["bounded","Bounded","ANY · HALF"]]
        .map(a => '<button class="slab" data-session="'+a[0]+'">'+a[1]+'<span>'+a[2]+'</span></button>').join("")
    + '</div>'
    + '<div style="display:flex;gap:8px;padding:0 18px 20px">'
      + '<button class="ghost" data-go="history">History</button>'
      + '<button class="ghost" data-go="data">Backup</button></div>'
    + '<div style="padding:6px 18px 8px"><div class="eyebrow">Today · live · '
      + es.filter(e=>kindOf(e)==="work").length+' work</div></div>'
    + (es.length
        ? '<div style="border-top:1px solid var(--rule);padding-bottom:44px">'+listHTML(es,{showEx:1})+'</div>'
        : '<div class="empty">Nothing recorded yet. Pick a day above.</div>');
}

function list(){
  const ids = S.session==="bounded" ? IDS : IDS.filter(i => EX[i].s===S.session);
  const today = dayKey(Date.now());
  const c = {}; dayOf(today).forEach(e => { if(kindOf(e)==="work") c[e.ex]=(c[e.ex]||0)+1; });
  const groups = {};
  ids.forEach(id => (groups[EX[id].g] = groups[EX[id].g]||[]).push(id));
  return '<div class="bar">'
    + '<button class="back" data-go="home"><i>←</i>'+S.session+'</button>'
    + '<div class="eyebrow">'+dayOf(today).filter(e=>e.session===S.session&&kindOf(e)==="work").length+' work today</div></div>'
    + '<div style="padding-bottom:44px">'
    + Object.keys(groups).map(g =>
        '<div class="head"><div class="eyebrow" style="color:var(--dim)">'+esc(g)+'</div></div>'
        + groups[g].map(id => '<button class="movement" data-ex="'+id+'">'
            + '<span>'+esc(EX[id].n)+'</span>'
            + '<em class="'+(c[id]?"has":"")+'">'+(c[id]?"·"+c[id]:"—")+'</em></button>').join("")
      ).join("") + '</div>';
}

function renderEntry(){
  const m = EX[S.ex];
  const today = dayKey(Date.now());
  const prior = exOf(S.ex).filter(e => dayKey(e.ts)!==today);
  app.innerHTML = '<div class="bar">'
    + '<button class="back" data-go="list"><i>←</i>'+S.session+'</button>'
    + '<div class="eyebrow" id="cnt">'+countLabel()+'</div></div>'
    + '<div style="padding:22px 18px 0">'
    + '<div style="font-size:21px;margin-bottom:20px">'+esc(m.n)+'</div>'
    + (m.vars ? '<div style="margin-bottom:20px"><div class="eyebrow" style="margin-bottom:10px">Leverage</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:6px">'
        + m.vars.map(v => '<button class="chip'+(v===S.variation?" on":"")+'" data-var="'+esc(v)+'">'+esc(v)+'</button>').join("")
        + '</div></div>' : '')
    + '<div style="display:flex;gap:10px">'
      + fieldHTML("Load","w",S.w,[-25,-5,5,25],"LB",m.bw)
      + (m.iso ? fieldHTML("Hold","hold",S.hold,[-5,-1,1,5],"SEC",0)
               : fieldHTML("Reps","reps",S.reps,[-5,-1,1,5],"REPS",0))
    + '</div>'
    + '<div class="kind">'
      + '<button data-kind="ramp" class="'+(S.kind==="ramp"?"on":"")+'">RAMP</button>'
      + '<button data-kind="work" class="'+(S.kind==="work"?"on":"")+'">WORK</button></div>'
    + '<button class="perform'+(S.kind==="ramp"?" ramp":"")+'" data-perform="1">PERFORM</button>'
    + '<div class="note">STAMPED ON TAP · NOT EDITABLE AFTER</div>'
    + (saveErr ? '<div class="note" style="color:var(--stamp)">'+esc(saveErr)+'</div>' : '')
    + '</div>'
    + '<div id="exlog" style="margin-top:14px;border-top:1px solid var(--rule);padding-bottom:46px">'
      + entryLog() + '</div>'
    + (prior.length ? '<div style="border-top:1px solid var(--rule);padding-bottom:50px">'
        + '<div class="head"><div class="eyebrow" style="color:var(--dim)">Earlier · '
        + prior.filter(e=>kindOf(e)==="work").length+' work</div></div>'
        + listHTML(prior.slice(0,40),{showEx:0}) + '</div>' : '');
  window.scrollTo(0,0);
}
function countLabel(){
  const t = exOf(S.ex, dayKey(Date.now())).filter(e=>kindOf(e)==="work").length;
  const a = exOf(S.ex).filter(e=>kindOf(e)==="work").length;
  return t+" today · "+a+" all";
}
function entryLog(){
  const es = exOf(S.ex, dayKey(Date.now()));
  if(!es.length) return '<div class="empty">No sets on this movement today.</div>';
  return listHTML(es, {showEx:0, void: Date.now()-es[0].ts < 120000});
}
function fieldHTML(label,k,val,steps,unit,bw){
  const isBW = bw && val===0;
  return '<div class="field"><div class="eyebrow" style="margin-bottom:10px">'+label+'</div>'
    + '<div class="box"><input type="number" inputmode="decimal" data-k="'+k+'" value="'+val+'" class="'+(isBW?"bw":"")+'">'
    + '<div class="unit" data-unit="'+k+'">'+(isBW?"BODYWEIGHT":unit)+'</div>'
    + '<div class="steps">'+steps.map(s =>
        '<button data-step="'+k+'" data-by="'+s+'">'+(s>0?"+"+s:s)+'</button>').join("")
    + '</div></div></div>';
}

function history(){
  const days = allDays();
  const work = DB.entries.filter(e=>kindOf(e)==="work").length;
  return '<div class="bar"><button class="back" data-go="home"><i>←</i>History</button>'
    + '<div class="eyebrow">'+work+' work sets</div></div>'
    + (days.length ? days.map(k => {
        const es = dayOf(k);
        const kinds = [...new Set(es.map(e=>e.session))].join(" · ");
        return '<button class="movement" data-day="'+k+'">'
          + '<span><span style="font-family:var(--mono);font-size:13px">'+dayLabel(k)+'</span>'
          + '<span style="display:block;font-size:11px;color:var(--graphite);letter-spacing:.06em;margin-top:4px;text-transform:uppercase">'+esc(kinds)+'</span></span>'
          + '<em class="has">·'+es.filter(e=>kindOf(e)==="work").length+'</em></button>';
      }).join("") : '<div class="empty">No history yet.</div>');
}

/* the grouped day view */
function dayView(){
  const es = dayOf(S.day);
  const blocks = groupDay(S.day);
  const work = es.filter(e=>kindOf(e)==="work");
  const ts = es.map(e=>e.ts);
  const sp = ts.length>1 ? span(Math.max.apply(null,ts)-Math.min.apply(null,ts)) : "—";
  const vol = volumeOf(es);
  const kinds = [...new Set(es.map(e=>e.session))].join(" · ").toUpperCase();

  return '<div class="bar"><button class="back" data-go="history"><i>←</i>'+dayLabel(S.day)+'</button>'
    + '<div class="eyebrow">'+esc(kinds)+'</div></div>'
    + '<div class="card">'
      + '<div><b>'+sp+'</b><u>Span</u></div>'
      + '<div><b>'+blocks.length+'</b><u>Movements</u></div>'
      + '<div><b>'+work.length+'</b><u>Work sets</u></div>'
      + '<div><b>'+(vol?comma(vol):"—")+'</b><u>Volume lb</u></div>'
    + '</div>'
    + '<div style="padding-bottom:50px">'
    + blocks.map(b => {
        const m = EX[b.ex];
        const vars = [...new Set(b.work.concat(b.ramp).map(e=>e.variation).filter(Boolean))];
        const rampTxt = b.ramp.length
          ? '<p class="ramp">ramp '+b.ramp.slice().sort((x,y)=>x.ts-y.ts).map(compact).join(" · ")+'</p>' : '';
        const sets = (b.work.length ? b.work : b.ramp).slice().sort((x,y)=>x.ts-y.ts)
          .map(e => figure(e)).join("<br>");
        return '<button class="blk" data-mday="'+b.ex+'">'
          + '<span class="name"><h4>'+esc(m.n)+'</h4>'
            + (vars.length ? '<p>'+esc(vars.join(" · "))+'</p>' : '')
            + rampTxt + '</span>'
          + '<span class="sets">'+sets+'</span>'
          + '<span class="chev">›</span></button>';
      }).join("")
    + '</div>';
}

/* drill-down: one movement on one day, with stamps */
function mdayView(){
  const es = exOf(S.ex, S.day);
  const m = EX[S.ex];
  const work = es.filter(e=>kindOf(e)==="work");
  return '<div class="bar"><button class="back" data-go="day"><i>←</i>'+esc(m.n)+'</button>'
    + '<div class="eyebrow">'+dayLabel(S.day)+'</div></div>'
    + '<div style="padding:16px 18px 4px"><div class="eyebrow">'
      + work.length+' work · '+(es.length-work.length)+' ramp</div></div>'
    + '<div style="border-top:1px solid var(--rule);margin-top:12px;padding-bottom:50px">'
      + listHTML(es,{showEx:0}) + '</div>';
}

function dataView(){
  return '<div class="bar"><button class="back" data-go="home"><i>←</i>Backup</button>'
    + '<div class="eyebrow">'+DB.entries.length+' entries</div></div>'
    + '<div style="padding:24px 18px 60px">'
    + '<div class="eyebrow" style="margin-bottom:10px">Export</div>'
    + '<div style="color:var(--graphite);font-size:13px;line-height:1.5;margin-bottom:14px">'
      + 'Copy or download the full ledger as JSON. Do this every few weeks — clearing browser data erases the log.</div>'
    + '<div style="display:flex;gap:8px;margin-bottom:30px">'
      + '<button class="ghost" data-copy="1">Copy JSON</button>'
      + '<button class="ghost" data-download="1">Download</button></div>'
    + '<div class="eyebrow" style="margin-bottom:10px">Import</div>'
    + '<div style="color:var(--graphite);font-size:13px;line-height:1.5;margin-bottom:12px">'
      + 'Paste a previous export. Entries merge by id; nothing is overwritten.</div>'
    + '<textarea id="imp" placeholder="Paste JSON"></textarea>'
    + '<div style="height:8px"></div><button class="ghost" data-import="1">Merge in</button>'
    + '<div id="msg" class="note" style="text-align:left;padding-top:14px"></div></div>';
}

/* ══ actions ═════════════════════════════════════════════ */
function openEx(id){
  const m = EX[id], p = DB.prefs[id] || {};
  S.ex = id;
  S.w = p.w != null ? p.w : 0;
  S.reps = p.reps != null ? p.reps : 5;
  S.hold = p.hold != null ? p.hold : 10;
  S.variation = m.vars ? (p.variation || m.vars[0]) : null;
  S.kind = p.kind === "ramp" ? "ramp" : "work";
  S.screen = "entry"; render();
}
function perform(){
  const m = EX[S.ex];
  const e = {id: Date.now()+"-"+Math.random().toString(36).slice(2,7), ts: Date.now(),
    session:S.session, ex:S.ex, w:S.w, kind:S.kind,
    reps: m.iso ? null : S.reps, hold: m.iso ? S.hold : null, variation:S.variation};
  DB.entries.push(e);
  DB.prefs[S.ex] = {w:S.w, reps:S.reps, hold:S.hold, variation:S.variation, kind:S.kind};
  save();
  S.fresh = e.id;
  document.getElementById("exlog").innerHTML = entryLog();
  const c = document.getElementById("cnt"); if(c) c.textContent = countLabel();
  if(navigator.vibrate) navigator.vibrate(18);
  setTimeout(() => { if(S.fresh===e.id){ S.fresh=null;
    const n = document.getElementById("exlog"); if(n && S.screen==="entry") n.innerHTML = entryLog(); } }, 2600);
}
function setVal(k,v){
  v = Math.max(0, Math.round(v*100)/100);
  S[k] = v;
  const inp = document.querySelector('input[data-k="'+k+'"]');
  if(!inp) return;
  inp.value = v;
  const bw = k==="w" && EX[S.ex].bw && v===0;
  inp.className = bw ? "bw" : "";
  const u = document.querySelector('[data-unit="'+k+'"]');
  if(u) u.textContent = bw ? "BODYWEIGHT" : (k==="w"?"LB":(k==="hold"?"SEC":"REPS"));
}
function merge(text){
  let inc;
  try{ inc = JSON.parse(text); }catch(e){ return "Not valid JSON."; }
  if(!inc || !Array.isArray(inc.entries)) return "No entries found in that file.";
  const have = new Set(DB.entries.map(e=>e.id));
  let n = 0;
  inc.entries.forEach(e => { if(e && e.id && !have.has(e.id)){ DB.entries.push(e); have.add(e.id); n++; } });
  DB.prefs = Object.assign({}, inc.prefs||{}, DB.prefs);
  save();
  return n+" entries merged. "+DB.entries.length+" total.";
}
function msg(t){ const n = document.getElementById("msg"); if(n) n.textContent = t; }

/* ══ events ══════════════════════════════════════════════ */
app.addEventListener("click", ev => {
  const t = ev.target.closest("[data-session],[data-ex],[data-go],[data-perform],[data-step],[data-var],[data-kind],[data-void],[data-day],[data-mday],[data-copy],[data-download],[data-import]");
  if(!t) return;
  const d = t.dataset;
  if(d.session){ S.session = d.session; S.screen = "list"; render(); }
  else if(d.mday){ S.ex = d.mday; S.screen = "mday"; render(); }
  else if(d.ex){ openEx(d.ex); }
  else if(d.go){ S.screen = (d.go==="list" && !S.session) ? "home" : d.go; render(); }
  else if(d.perform){ perform(); }
  else if(d.step){ setVal(d.step, (S[d.step]||0) + Number(d.by)); }
  else if(d.var){ S.variation = d.var; renderEntry(); }
  else if(d.kind){ S.kind = d.kind; renderEntry(); }
  else if(d.void){ DB.entries = DB.entries.filter(e => e.id !== d.void); save();
    document.getElementById("exlog").innerHTML = entryLog();
    const c = document.getElementById("cnt"); if(c) c.textContent = countLabel(); }
  else if(d.day){ S.day = d.day; S.screen = "day"; render(); }
  else if(d.copy){
    const txt = JSON.stringify(DB);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(() => msg("Copied. Paste it somewhere safe."))
      .catch(() => { const ta = document.getElementById("imp"); ta.value = txt; ta.select();
        msg("Copy failed — the export is in the box below. Select and copy it."); });
  }
  else if(d.download){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:"application/json"}));
    a.download = "ledger-"+dayKey(Date.now())+".json";
    document.body.appendChild(a); a.click(); a.remove(); msg("Downloaded.");
  }
  else if(d.import){ msg(merge(document.getElementById("imp").value)); }
});
app.addEventListener("input", ev => {
  const k = ev.target.dataset.k;
  if(!k) return;
  S[k] = ev.target.value === "" ? 0 : Math.max(0, Number(ev.target.value));
});

load(); render();
</script>
</body>
</html>

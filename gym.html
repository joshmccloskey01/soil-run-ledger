<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Gym</title>
<style>
  :root{
    --bg:#000;
    --card:#141618;
    --line:#232729;
    --fg:#f2f4f5;
    --dim:#8b9296;
    --base:#2563eb;
    --edge:#b0392b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select:none;user-select:none;
  }
  .wrap{max-width:560px;margin:0 auto;padding:10px 12px 30px}

  header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 12px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
  .cnt{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
  .cnt b{color:var(--fg);font-weight:700}

  .card{
    background:var(--card);border-radius:14px;padding:14px 14px 12px;margin-bottom:10px;
    display:grid;grid-template-columns:1fr 108px;gap:12px;align-items:center;
  }
  .name{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .kind{font-size:13px;color:var(--dim);margin-top:2px}

  .set{margin-top:9px;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.5}
  .set .tag{font-weight:700}
  .set.b .tag{color:#5b8df6}
  .set.e .tag{color:#d4705f}
  .num{
    font-weight:600;padding:1px 3px;border-radius:4px;cursor:pointer;
    border-bottom:1px dashed var(--line);
  }
  .num:active{background:#232729}
  .u{color:var(--dim);font-size:13px}

  .marks{margin-top:9px;font-size:17px;letter-spacing:.09em;min-height:20px;word-break:break-all}
  .mb{color:#5b8df6}
  .me{color:#d4705f}
  .m0{color:var(--line)}

  .btns{display:flex;flex-direction:column;gap:8px}
  .btns button{
    appearance:none;border:0;border-radius:11px;color:#fff;font:inherit;
    font-size:16px;font-weight:700;padding:17px 0;cursor:pointer;
  }
  .btns .bB{background:var(--base)}
  .btns .bE{background:var(--edge)}
  .btns button:active{filter:brightness(.75)}
  .btns button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .card.solo .btns button{padding:26px 0}

  .foot{display:flex;gap:8px;margin-top:14px}
  .foot button{
    flex:1;appearance:none;background:var(--card);border:0;border-radius:11px;color:var(--dim);
    font:inherit;font-size:14px;font-weight:600;padding:15px 4px;cursor:pointer;
  }
  .foot button:active{background:#1d2124;color:var(--fg)}

  #hist{margin-top:14px;background:var(--card);border-radius:14px;padding:14px;display:none;font-size:14px;line-height:1.7}
  #hist .wk{margin-bottom:14px}
  #hist .wk:last-child{margin-bottom:0}
  #hist .lbl{font-weight:700;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  #hist .r{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
  #hist .r span:last-child{color:var(--dim)}

  #toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--fg);color:#000;
    font-size:14px;font-weight:700;padding:11px 17px;border-radius:9px;opacity:0;
    pointer-events:none;transition:opacity .15s;
  }
  #toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="day">Gym</h1>
    <div class="cnt">TODAY <b id="sum">0</b></div>
  </header>

  <div id="list"></div>

  <div class="foot">
    <button id="undo">Undo</button>
    <button id="weeks">4 weeks</button>
  </div>
  <div id="hist"></div>
</div>
<div id="toast"></div>

<script>
const DEF = [
  {id:"bench", name:"Bench press",      kind:"Horizontal push", b:[95,5],  e:[155,1]},
  {id:"press", name:"1-arm press",      kind:"Vertical push",   b:[35,5],  e:[55,1]},
  {id:"clean", name:"Power clean",      kind:"Power",           b:[65,2],  e:[95,1]},
  {id:"dead",  name:"Deadlift",         kind:"Hinge",           b:[95,5],  e:[145,1]},
  {id:"belt",  name:"Belt squat",       kind:"Squat",           b:[90,5],  e:[140,1]},
  {id:"pull",  name:"Weighted pull-up", kind:"Vertical pull",   b:[155,2], e:[170,1]},
  {id:"cardio",name:"Cardio",           kind:"",                solo:true}
];

const KEY="gym.simple.v1";
let DB={sets:[],cfg:{}};

const store={
  async get(){try{
    if(window.storage){const r=await window.storage.get(KEY);return r?JSON.parse(r.value):null;}
    const s=localStorage.getItem(KEY);return s?JSON.parse(s):null;
  }catch(e){return null}},
  async set(v){try{
    if(window.storage){await window.storage.set(KEY,JSON.stringify(v));return;}
    localStorage.setItem(KEY,JSON.stringify(v));
  }catch(e){}}
};

const dk=d=>{const x=d||new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const L =id=>DEF.find(l=>l.id===id);
const cfg=(id,t)=>{const c=DB.cfg[id]&&DB.cfg[id][t];return c?c:L(id)[t]};
const cnt=(id,t)=>DB.sets.filter(s=>s.d===dk()&&s.id===id&&s.t===t).length;

function tally(n){if(!n)return"\u00b7";let o="",f=Math.floor(n/5),r=n%5;for(let i=0;i<f;i++)o+="\u5350 ";return (o+"|".repeat(r)).trim()}

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("on"),1100)}

function card(l){
  if(l.solo){
    const n=cnt(l.id,"b");
    return '<div class="card solo"><div>'+
      '<div class="name">'+l.name+'</div>'+
      '<div class="marks '+(n?"mb":"m0")+'" data-m="'+l.id+'-b">'+tally(n)+'</div>'+
      '</div><div class="btns"><button class="bB" data-go="'+l.id+'|b">Log</button></div></div>';
  }
  const bb=cfg(l.id,"b"), ee=cfg(l.id,"e");
  const nb=cnt(l.id,"b"), ne=cnt(l.id,"e");
  return '<div class="card"><div>'+
    '<div class="name">'+l.name+'</div>'+
    '<div class="kind">'+l.kind+'</div>'+
    '<div class="set b"><span class="tag">Base</span> '+
      '<span class="num" data-ed="'+l.id+'|b|0">'+bb[0]+'</span><span class="u"> lb \u00d7 </span>'+
      '<span class="num" data-ed="'+l.id+'|b|1">'+bb[1]+'</span><span class="u"> reps</span></div>'+
    '<div class="set e"><span class="tag">Edge</span> '+
      '<span class="num" data-ed="'+l.id+'|e|0">'+ee[0]+'</span><span class="u"> lb \u00d7 </span>'+
      '<span class="num" data-ed="'+l.id+'|e|1">'+ee[1]+'</span><span class="u"> reps</span></div>'+
    '<div class="marks">'+
      '<span class="'+(nb?"mb":"m0")+'">'+tally(nb)+'</span>'+
      '<span class="'+(ne?"me":"m0")+'" style="margin-left:10px">'+tally(ne)+'</span>'+
    '</div></div>'+
    '<div class="btns">'+
      '<button class="bB" data-go="'+l.id+'|b">Base</button>'+
      '<button class="bE" data-go="'+l.id+'|e">Edge</button>'+
    '</div></div>';
}

function render(){
  document.getElementById("day").textContent=new Date().toLocaleDateString(undefined,{weekday:"long"});
  document.getElementById("list").innerHTML=DEF.map(card).join("");
  document.getElementById("sum").textContent=DB.sets.filter(s=>s.d===dk()&&s.id!=="cardio").length;
}

async function go(id,t){
  const w = L(id).solo ? 0 : cfg(id,t)[0];
  DB.sets.push({d:dk(),id,t,w,ts:Date.now()});
  render(); if(navigator.vibrate)navigator.vibrate(12);
  await store.set(DB);
}

async function edit(id,t,i){
  const cur=cfg(id,t).slice();
  const what=i===0?"Weight (lb)":"Reps";
  const v=prompt(L(id).name+" \u2014 "+(t==="b"?"Base":"Edge")+" "+what, cur[i]);
  if(v===null)return;
  const n=parseFloat(v); if(isNaN(n)||n<0)return;
  cur[i]=n;
  DB.cfg[id]=DB.cfg[id]||{}; DB.cfg[id][t]=cur;
  render(); await store.set(DB);
}

async function undo(){
  if(!DB.sets.length){toast("Nothing to undo");return}
  const last=DB.sets.pop(); render();
  toast("Removed "+(L(last.id).solo?"cardio":L(last.id).name+" "+(last.t==="b"?"base":"edge")));
  await store.set(DB);
}

function weeks(){
  const h=document.getElementById("hist");
  if(h.style.display==="block"){h.style.display="none";return}
  const now=new Date(),out=[];
  for(let k=0;k<4;k++){
    const end=new Date(now);end.setDate(end.getDate()-7*k);
    const st=new Date(end);st.setDate(st.getDate()-6);
    const w=DB.sets.filter(s=>{const d=new Date(s.d+"T12:00");return d>=st&&d<=end});
    const lbl=k===0?"This week":k+" week"+(k>1?"s":"")+" back";
    const rows=DEF.map(l=>{
      const b=w.filter(s=>s.id===l.id&&s.t==="b"), e=w.filter(s=>s.id===l.id&&s.t==="e");
      if(!b.length&&!e.length)return null;
      const top=[].concat(b,e).reduce(function(m,s){return Math.max(m,s.w)},0);
      const bit=l.solo?(b.length+" sessions"):(b.length+" base \u00b7 "+e.length+" edge \u00b7 top "+top+"lb");
      return '<div class="r"><span>'+l.name+'</span><span>'+bit+'</span></div>';
    }).filter(Boolean);
    out.push('<div class="wk"><div class="lbl">'+lbl+'</div>'+(rows.length?rows.join(""):'<div class="r"><span>\u2014</span><span></span></div>')+'</div>');
  }
  h.innerHTML=out.join(""); h.style.display="block";
}

document.addEventListener("click",function(e){
  const g=e.target.closest("[data-go]");
  if(g){const p=g.dataset.go.split("|");go(p[0],p[1]);return}
  const d=e.target.closest("[data-ed]");
  if(d){const q=d.dataset.ed.split("|");edit(q[0],q[1],+q[2])}
});
document.getElementById("undo").addEventListener("click",undo);
document.getElementById("weeks").addEventListener("click",weeks);

(function(){
  store.get().then(function(s){
    if(s){DB.sets=s.sets||[];DB.cfg=s.cfg||{}}
    render();
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Tally</title>
<style>
  :root{
    --ink:#141414;
    --slab:#1d1d1d;
    --chalk:#efece4;
    --dust:#7d786c;
    --rule:#2e2e2c;
    --mark:#c8462d;
    --ok:#8a9a5b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--chalk)}
  body{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select:none;user-select:none;
  }
  .wrap{max-width:540px;margin:0 auto;padding:14px 12px 28px}

  header{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 12px}
  .date{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust)}
  .total{font-size:13px;letter-spacing:.14em;color:var(--dust)}
  .total b{color:var(--chalk);font-weight:600}

  .row{
    display:grid;grid-template-columns:1fr auto;align-items:stretch;
    border-top:1px solid var(--rule);
  }
  .row:last-of-type{border-bottom:1px solid var(--rule)}

  .hit{
    appearance:none;border:0;background:transparent;color:inherit;font:inherit;
    text-align:left;padding:17px 6px 15px;cursor:pointer;display:block;width:100%;
    transition:background .09s;
  }
  .hit:active{background:var(--slab)}
  .hit:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}
  .lift{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
  .marks{
    margin-top:8px;min-height:22px;font-size:21px;line-height:1;letter-spacing:.10em;
    color:var(--mark);word-break:break-all;
  }
  .marks.none{color:var(--rule)}

  .wt{
    display:flex;flex-direction:column;justify-content:center;align-items:stretch;
    border-left:1px solid var(--rule);width:104px;
  }
  .wt button{
    appearance:none;border:0;background:transparent;color:var(--dust);
    font:inherit;font-size:20px;line-height:1;padding:9px 0;cursor:pointer;
  }
  .wt button:active{color:var(--chalk);background:var(--slab)}
  .wt .val{
    text-align:center;font-size:20px;font-weight:600;padding:1px 0;color:var(--chalk);
  }
  .wt .unit{text-align:center;font-size:10px;letter-spacing:.16em;color:var(--dust);text-transform:uppercase}

  .cardio{margin-top:22px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .cardio .hit{padding-bottom:15px}
  .cardio .lift{color:var(--ok)}
  .cardio .marks{color:var(--ok)}

  .foot{display:flex;gap:8px;margin-top:20px}
  .foot button{
    flex:1;appearance:none;background:transparent;border:1px solid var(--rule);
    color:var(--dust);font:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    padding:13px 4px;border-radius:2px;cursor:pointer;
  }
  .foot button:active{background:var(--slab);color:var(--chalk)}

  #hist{
    margin-top:18px;font-size:13px;color:var(--dust);line-height:1.75;display:none;
    border-top:1px solid var(--rule);padding-top:14px;
  }
  #hist b{color:var(--chalk);font-weight:600}
  #hist .wk{margin-bottom:12px}

  #toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:24px;
    background:var(--chalk);color:var(--ink);font-size:13px;font-weight:600;
    padding:10px 16px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .16s;
    letter-spacing:.02em;
  }
  #toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="date" id="today">—</div>
    <div class="total">TODAY <b id="sum">0</b></div>
  </header>

  <div id="lifts"></div>

  <div class="cardio" id="cardioBox"></div>

  <div class="foot">
    <button id="undo">Undo</button>
    <button id="weeks">4 weeks</button>
  </div>

  <div id="hist"></div>
</div>
<div id="toast"></div>

<script>
const LIFTS = [
  {id:"bench",  name:"Bench",             w:95},
  {id:"press",  name:"1-arm press",       w:35},
  {id:"clean",  name:"Power clean",       w:70},
  {id:"dead",   name:"Deadlift",          w:95},
  {id:"belt",   name:"Belt squat",        w:90},
  {id:"pull",   name:"Weighted pull-up",  w:0}
];
const CARDIO = {id:"cardio", name:"Cardio"};

const KEY = "tally.v1";
let DB = {sets:[], weights:{}};

/* storage: window.storage inside Claude, localStorage when self-hosted */
const store = {
  async get(){
    try{
      if(window.storage){ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
      const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  },
  async set(v){
    try{
      if(window.storage){ await window.storage.set(KEY, JSON.stringify(v)); return; }
      localStorage.setItem(KEY, JSON.stringify(v));
    }catch(e){}
  }
};

const dayKey = d => { const x = d||new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const wOf = id => DB.weights[id] ?? (LIFTS.find(l=>l.id===id)?.w ?? 0);
const todaySets = id => DB.sets.filter(s=>s.d===dayKey() && s.id===id).length;

function tally(n){
  if(!n) return "·";
  let out="", full=Math.floor(n/5), rem=n%5;
  for(let i=0;i<full;i++) out += "卌 ";
  out += "|".repeat(rem);
  return out.trim();
}

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("on"),1100);
}

function rowHTML(l, isCardio){
  const n = todaySets(l.id);
  return `<div class="row" data-row="${l.id}">
    <button class="hit" data-log="${l.id}" aria-label="Record ${isCardio?"a session":"a set"} of ${l.name}">
      <div class="lift">${l.name}</div>
      <div class="marks ${n?"":"none"}" data-marks="${l.id}">${tally(n)}</div>
    </button>
    ${isCardio ? "" : `<div class="wt">
      <button data-inc="${l.id}" aria-label="Add 5 pounds to ${l.name}">+</button>
      <div class="val" data-w="${l.id}">${wOf(l.id)}</div>
      <div class="unit">lb</div>
      <button data-dec="${l.id}" aria-label="Take 5 pounds off ${l.name}">−</button>
    </div>`}
  </div>`;
}

function paintRow(id){
  const n = todaySets(id);
  const m = document.querySelector(`[data-marks="${id}"]`);
  if(m){ m.textContent = tally(n); m.classList.toggle("none", n===0); }
  const w = document.querySelector(`[data-w="${id}"]`);
  if(w) w.textContent = wOf(id);
  document.getElementById("sum").textContent =
    DB.sets.filter(s=>s.d===dayKey() && s.id!=="cardio").length;
}

function render(){
  document.getElementById("today").textContent =
    new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  document.getElementById("lifts").innerHTML = LIFTS.map(l=>rowHTML(l,false)).join("");
  document.getElementById("cardioBox").innerHTML = rowHTML(CARDIO,true);
  LIFTS.forEach(l=>paintRow(l.id)); paintRow("cardio");
}

async function log(id){
  DB.sets.push({d:dayKey(), id, w:wOf(id), t:Date.now()});
  paintRow(id);
  if(navigator.vibrate) navigator.vibrate(12);
  await store.set(DB);
}

async function bump(id, delta){
  const next = Math.max(0, wOf(id)+delta);
  DB.weights[id] = next;
  paintRow(id);
  toast((LIFTS.find(l=>l.id===id).name)+" → "+next+" lb");
  await store.set(DB);
}

async function undo(){
  if(!DB.sets.length){ toast("Nothing to undo"); return; }
  const last = DB.sets.pop();
  paintRow(last.id);
  toast("Removed 1 "+(LIFTS.find(l=>l.id===last.id)?.name || "cardio"));
  await store.set(DB);
}

function weeks(){
  const h = document.getElementById("hist");
  if(h.style.display==="block"){ h.style.display="none"; return; }
  const now=new Date(), out=[];
  for(let k=0;k<4;k++){
    const end=new Date(now); end.setDate(end.getDate()-7*k);
    const start=new Date(end); start.setDate(start.getDate()-6);
    const inWk = DB.sets.filter(s=>{ const d=new Date(s.d+"T12:00"); return d>=start && d<=end; });
    const label = k===0 ? "This week" : k+" week"+(k>1?"s":"")+" back";
    const parts = [...LIFTS,CARDIO].map(l=>{
      const c = inWk.filter(s=>s.id===l.id);
      if(!c.length) return null;
      const w = l.id==="cardio" ? "" : " @"+Math.max(...c.map(s=>s.w))+"lb";
      return l.name+" <b>"+c.length+"</b>"+w;
    }).filter(Boolean);
    out.push(`<div class="wk"><b>${label}</b><br>${parts.length?parts.join("<br>"):"—"}</div>`);
  }
  h.innerHTML = out.join("");
  h.style.display="block";
}

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-log],[data-inc],[data-dec]");
  if(!t) return;
  if(t.dataset.log)      log(t.dataset.log);
  else if(t.dataset.inc) bump(t.dataset.inc, 5);
  else if(t.dataset.dec) bump(t.dataset.dec,-5);
});
document.getElementById("undo").addEventListener("click", undo);
document.getElementById("weeks").addEventListener("click", weeks);

(async ()=>{
  const saved = await store.get();
  if(saved){ DB.sets = saved.sets||[]; DB.weights = saved.weights||{}; }
  render();
})();
</script>
</body>
</html>
